[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zyrelay-docintelligence"
version = "1.0.0"
description = "Production-ready, rule-first enterprise document intelligence for PDF and DOCX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.9,<3.0",
  "PyMuPDF>=1.24,<2.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.12,<1.0",
  "PyYAML>=6.0,<7.0",
  "rapidfuzz>=3.9,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]
test = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
]
paddleocr = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
]
local-ai = [
  "doclayout-yolo>=0.0.4",
  "fasttext-wheel>=0.9.2",
  "GLiNER>=0.2.0",
  "sentence-transformers>=3.0",
  "SymSpellPy>=6.7",
  "torch>=2.4",
  "transformers>=4.45,<5.0",
  "tree-sitter>=0.23",
  "tree-sitter-java>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-python>=0.23",
]

[project.scripts]
zyrelay-plugin = "zyrelay.plugin.cli:main"
zyrelay = "zyrelay.benchmark_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["zyrelay"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "zyrelay/_config"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
  "model_integration: requires a pre-provisioned optional model",
  "slow: executes a real local OCR model",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# FastAPI dependency defaults and deliberate broad catches at optional model
# boundaries are part of Relay's public contract. They are documented and
# tested rather than mechanically rewritten by the linter.
ignore = ["B008", "B023", "BLE001", "RUF007", "RUF012"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
exclude = ["tests", "benchmark"]
