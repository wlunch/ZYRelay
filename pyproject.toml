[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zyrelay-docintelligence"
version = "0.5.0"
description = "Rule-first, provenance-aware document intelligence for PDF and DOCX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.9,<3.0",
  "PyMuPDF>=1.24,<2.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.12,<1.0",
  "PyYAML>=6.0,<7.0",
  "rapidfuzz>=3.9,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
]
test = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
]
paddleocr = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
]

[project.scripts]
zyrelay-plugin = "zyrelay.plugin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["zyrelay"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "zyrelay/_config"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
  "model_integration: requires a pre-provisioned optional model",
  "slow: executes a real local OCR model",
]
