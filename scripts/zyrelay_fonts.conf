<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Local rendering helper for macOS. It deliberately contains no user path. -->
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <cachedir>/private/tmp/zyrelay_fontconfig_cache</cachedir>
  <match target="pattern">
    <test qual="any" name="family"><string>PingFang SC</string></test>
    <edit name="family" mode="assign" binding="same"><string>Hiragino Sans GB</string></edit>
  </match>
</fontconfig>
