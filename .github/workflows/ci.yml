name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check zyrelay tests
      - run: ruff format --check zyrelay tests
      - run: mypy --follow-imports=skip zyrelay/app/models zyrelay/plugin/lifecycle.py zyrelay/resources/models.py zyrelay/relay/models.py
      - run: pytest -q -m 'not slow'
      - run: pytest -q tests/test_api.py tests/plugin/test_plugin_http.py
      - run: python benchmark/scripts/run_benchmark.py --suite contract --output benchmark/results/ci
